# cronwatch example configuration
# Copy to config.yaml and adjust to your environment.

alerts:
  smtp_host: smtp.example.com
  smtp_port: 587
  from_addr: cronwatch@example.com
  to_addr: ops@example.com
  username: cronwatch@example.com
  password: "changeme"

jobs:
  - name: daily_backup
    schedule: "0 2 * * *"
    command: /usr/local/bin/backup.sh
    grace_period: 300          # seconds after expected start before alert
    timeout: 3600              # max allowed runtime in seconds
    tags:
      - backup
      - critical
    env:
      BACKUP_DEST: /mnt/backups
      RETENTION_DAYS: "30"

  - name: hourly_sync
    schedule: "@hourly"
    command: /usr/local/bin/sync.sh
    grace_period: 120
    timeout: 600
    tags:
      - sync
    env:
      SYNC_TARGET: s3://my-bucket/data
      AWS_PROFILE: cronwatch

  - name: weekly_report
    schedule: "0 8 * * 1"
    command: /usr/local/bin/report.py
    grace_period: 600
    depends_on:
      - daily_backup
