[metadata]
name = cronwatch
version = 0.1.0
author = cronwatch contributors
description = Lightweight daemon that monitors cron job execution and sends alerts on failures or missed runs.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
python_requires = >=3.9

[options]
packages = find:
install_requires =
    croniter>=1.3
    PyYAML>=6.0

[options.entry_points]
console_scripts =
    cronwatch = cronwatch.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov

[tool:pytest]
testpaths = tests
addopts = -v --tb=short
